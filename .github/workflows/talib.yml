name: TA-Lib (Windows)

# 每週檢查上游：ta-lib（PyPI）、TA-Lib C 函式庫（最新 tag）、最新 3 個穩定 CPython。
# 只編譯 Release 裡還沒有的 Python 版本；force 會全部重新編譯。
on:
  schedule:
    - cron: "17 3 * * 1" # 每週一 03:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "全部重新編譯（覆蓋 Release 裡已有的 wheel）"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      c_version: ${{ steps.plan.outputs.c_version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force || false }}
        run: python3 .github/scripts/plan.py talib

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    name: cp${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TALIB_C: ${{ github.workspace }}\ta-lib-c
    steps:
      - uses: actions/checkout@v7
        with:
          repository: TA-Lib/ta-lib-python
          ref: v${{ needs.plan.outputs.version }}
          path: ta-lib-python

      # C 函式庫只跟 C 版本有關：每個版本只編一次，之後各 Python 直接用快取。
      - id: cache
        uses: actions/cache@v6
        with:
          path: ta-lib-c
          key: ta-lib-c-${{ needs.plan.outputs.c_version }}-win64-msvc

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build TA-Lib C ${{ needs.plan.outputs.c_version }}
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          C_VERSION: ${{ needs.plan.outputs.c_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $src = "$env:RUNNER_TEMP\ta-lib-src"
          curl.exe -fsSL -o "$env:RUNNER_TEMP\ta-lib.zip" "https://github.com/TA-Lib/ta-lib/archive/refs/tags/v$env:C_VERSION.zip"
          New-Item -ItemType Directory -Force $src | Out-Null
          tar -xf "$env:RUNNER_TEMP\ta-lib.zip" -C $src
          $root = (Get-ChildItem $src -Directory)[0].FullName
          cmake -S $root -B "$root\_build" -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DBUILD_DEV_TOOLS=OFF
          cmake --build "$root\_build" --target ta-lib-static
          New-Item -ItemType Directory -Force "$env:TALIB_C\include\ta-lib", "$env:TALIB_C\lib" | Out-Null
          Copy-Item "$root\include\*.h" "$env:TALIB_C\include\ta-lib"
          Copy-Item "$root\include\*.h" "$env:TALIB_C\include"
          Copy-Item "$root\_build\ta-lib-static.lib" "$env:TALIB_C\lib"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        shell: pwsh
        env:
          TA_INCLUDE_PATH: ${{ env.TALIB_C }}\include
          TA_LIBRARY_PATH: ${{ env.TALIB_C }}\lib
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -q --upgrade pip
          python -m pip wheel ./ta-lib-python --no-deps -w dist
          Get-ChildItem dist

      - name: Smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Test-Path "dist\${{ matrix.wheel }}")) { throw "expected dist\${{ matrix.wheel }}" }
          python -m pip install -q "dist\${{ matrix.wheel }}"
          python -c "import numpy, talib; print(talib.__version__, talib.__ta_version__); print(talib.SMA(numpy.arange(10.0), 3)[-1])"

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-talib-cp${{ matrix.python }}
          path: dist/${{ matrix.wheel }}
          if-no-files-found: error

  release:
    needs: [plan, build]
    # 某個 Python 版本失敗不影響其他版本上傳。
    if: ${{ !cancelled() && needs.plan.outputs.build == 'true' }}
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      artifacts: wheel-talib-*
      title: TA-Lib ${{ needs.plan.outputs.version }}
      notes: "TA-Lib ${{ needs.plan.outputs.version }}（TA-Lib C ${{ needs.plan.outputs.c_version }}），Windows x64。"
      install: pip install ta-lib --extra-index-url {index}/simple/
    permissions:
      contents: write
      pages: write
      id-token: write
