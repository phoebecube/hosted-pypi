name: TA-Lib (Windows)

# 每週檢查上游：ta-lib（PyPI）、TA-Lib C 函式庫（最新 tag）、最新 3 個穩定 CPython。
# 只編譯 Release 裡還沒有的 Python 版本；force 會全部重新編譯。
on:
  push: # TEMP: 合併前移除
    branches: [claude/pensive-goodall-vgnvsr]
    paths: [.github/workflows/talib.yml, .github/scripts/**]
  schedule:
    - cron: "17 3 * * 1" # 每週一 03:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "全部重新編譯（覆蓋 Release 裡已有的 wheel）"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      c_version: ${{ steps.plan.outputs.c_version }}
      c_prebuilt: ${{ steps.plan.outputs.c_prebuilt }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force || false }}
        run: python3 .github/scripts/plan.py talib

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    name: cp${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TALIB_C: ${{ github.workspace }}\ta-lib-c
    steps:
      - uses: actions/checkout@v7
        with:
          repository: TA-Lib/ta-lib-python
          ref: v${{ needs.plan.outputs.version }}
          path: ta-lib-python

      # C 函式庫只跟 C 版本有關：優先用官方預編譯包，沒有才自己編；結果依版本快取。
      - id: cache
        uses: actions/cache@v6
        with:
          path: ta-lib-c
          key: ta-lib-c-${{ needs.plan.outputs.c_version }}-win64

      - name: Fetch official TA-Lib C ${{ needs.plan.outputs.c_version }} build
        id: prebuilt
        if: steps.cache.outputs.cache-hit != 'true' && needs.plan.outputs.c_prebuilt != ''
        continue-on-error: true
        shell: pwsh
        env:
          URL: ${{ needs.plan.outputs.c_prebuilt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $dir = "$env:RUNNER_TEMP\ta-lib-prebuilt"
          New-Item -ItemType Directory -Force $dir | Out-Null
          curl.exe -fsSL -o "$dir.zip" $env:URL
          tar -xf "$dir.zip" -C $dir
          $lib = Get-ChildItem $dir -Recurse -Filter ta-lib-static.lib | Select-Object -First 1
          $hdr = Get-ChildItem $dir -Recurse -Filter ta_defs.h | Select-Object -First 1
          if (-not $lib -or -not $hdr) { throw "unexpected layout in $env:URL" }
          New-Item -ItemType Directory -Force "$env:TALIB_C\include\ta-lib", "$env:TALIB_C\lib" | Out-Null
          Copy-Item "$($hdr.DirectoryName)\*.h" "$env:TALIB_C\include\ta-lib"
          Copy-Item "$($hdr.DirectoryName)\*.h" "$env:TALIB_C\include"
          Copy-Item $lib.FullName "$env:TALIB_C\lib"

      - if: steps.cache.outputs.cache-hit != 'true' && steps.prebuilt.outcome != 'success'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Build TA-Lib C ${{ needs.plan.outputs.c_version }} from source
        if: steps.cache.outputs.cache-hit != 'true' && steps.prebuilt.outcome != 'success'
        shell: pwsh
        env:
          C_VERSION: ${{ needs.plan.outputs.c_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $src = "$env:RUNNER_TEMP\ta-lib-src"
          curl.exe -fsSL -o "$env:RUNNER_TEMP\ta-lib.zip" "https://github.com/TA-Lib/ta-lib/archive/refs/tags/v$env:C_VERSION.zip"
          New-Item -ItemType Directory -Force $src | Out-Null
          tar -xf "$env:RUNNER_TEMP\ta-lib.zip" -C $src
          $root = (Get-ChildItem $src -Directory)[0].FullName
          cmake -S $root -B "$root\_build" -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DBUILD_DEV_TOOLS=OFF
          cmake --build "$root\_build" --target ta-lib-static
          New-Item -ItemType Directory -Force "$env:TALIB_C\include\ta-lib", "$env:TALIB_C\lib" | Out-Null
          Copy-Item "$root\include\*.h" "$env:TALIB_C\include\ta-lib"
          Copy-Item "$root\include\*.h" "$env:TALIB_C\include"
          Copy-Item "$root\_build\ta-lib-static.lib" "$env:TALIB_C\lib"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        shell: pwsh
        env:
          TA_INCLUDE_PATH: ${{ env.TALIB_C }}\include
          TA_LIBRARY_PATH: ${{ env.TALIB_C }}\lib
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -q --upgrade pip
          python -m pip wheel ./ta-lib-python --no-deps -w dist
          Get-ChildItem dist

      - name: Smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Test-Path "dist\${{ matrix.wheel }}")) { throw "expected dist\${{ matrix.wheel }}" }
          python -m pip install -q "dist\${{ matrix.wheel }}"
          python -c "import numpy, talib; print(talib.__version__, talib.__ta_version__); print(talib.SMA(numpy.arange(10.0), 3)[-1])"

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-talib-cp${{ matrix.python }}
          path: dist/${{ matrix.wheel }}
          if-no-files-found: error

  release:
    needs: [plan, build]
    # 某個 Python 版本失敗不影響其他版本上傳。
    if: ${{ !cancelled() && needs.plan.outputs.build == 'true' }}
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      artifacts: wheel-talib-*
      title: TA-Lib ${{ needs.plan.outputs.version }}
      notes: "TA-Lib ${{ needs.plan.outputs.version }}（TA-Lib C ${{ needs.plan.outputs.c_version }}），Windows x64。"
      install: pip install ta-lib --extra-index-url {index}/simple/
    permissions:
      contents: write
      pages: write
      id-token: write
