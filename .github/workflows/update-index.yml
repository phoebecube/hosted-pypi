name: Update PyPI Index

# 掃描所有 Release 的 wheel，產生 PEP 503 索引並部署到 GitHub Pages：
#   /simple/   全部套件
#   /cuXXX/    只含 +cuXXX 的 wheel（跟 PyTorch 官方索引一樣按 CUDA 分開）
on:
  release:
    types: [published]
  workflow_call:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    # 放在 job 層級，被其他 workflow 呼叫時也會排隊，不會同時部署。
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: 產生 PyPI 索引
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_DIR: site
        run: python3 .github/scripts/generate_index.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
