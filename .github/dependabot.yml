version: 2
updates:
  # 只更新 workflow 裡的 action 版本。
  # minor/patch 合併成一個 PR，major 單獨開 PR。
  # 套件、Python、torch、CUDA 版本不寫在倉庫裡，每次執行由 .github/scripts/plan.py 向上游查詢。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
